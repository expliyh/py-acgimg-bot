[tool.poetry]
package-mode = false
name = "py-acgimg-bot"
version = "0.1.0"
description = ""
authors = ["Expliyh <expliyh@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.165.0"
uvicorn = "0.54.0"
python-telegram-bot = {extras = ["all"], version = "22.8"}
sqlalchemy = {extras = ["asyncio"], version = "2.1.8"}
asyncmy = "0.2.18"
mariadb = "1.1.15"
python-dotenv = "^1.0.0"
aiosqlite = "0.22.1"
singleton-class-decorator = "^1.0.1"
aiofiles = "25.1.0"
aiohttp = "3.14.5"
python-multipart = "0.0.33"
aiorwlock = "1.5.1"
pillow = "13.0.0"
pixivpy3 = "3.7.5"
b2sdk = "2.13.3"
redis = "8.1.0"
regex = ">=2024.11.6"
tzdata = ">=2024.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.coverage.run]
# Measure the whole checkout, then keep only first-party business modules.
# tests/ is the suite itself. .venv and site-packages are third-party.
# webui/ is the Vue frontend and has no business Python.
source = ["."]
omit = [
    "tests/*",
    "tests/**",
    ".venv/*",
    "*/.venv/*",
    "*/site-packages/*",
    "webui/*",
    "webui/**",
]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
precision = 2
show_missing = true
# Do not use fail_under here. With --cov-branch, coverage.py fails on the
# combined line+branch percentage. Statement coverage is gated by
# tests/check_statement_coverage.py, which requires strictly more than 80%.
