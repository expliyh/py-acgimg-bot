[tool.poetry]
package-mode = false
name = "py-acgimg-bot"
version = "0.1.0"
description = ""
authors = ["Expliyh <expliyh@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.141.1"
uvicorn = "0.52.4"
python-telegram-bot = {extras = ["all"], version = "22.8"}
sqlalchemy = {extras = ["asyncio"], version = "2.0.52"}
asyncmy = "0.2.14"
mariadb = "1.1.14"
python-dotenv = "^1.0.0"
aiosqlite = "0.22.1"
singleton-class-decorator = "^1.0.1"
aiofiles = "25.1.0"
aiohttp = "3.14.3"
python-multipart = "0.0.32"
aiorwlock = "1.5.1"
pillow = "12.3.0"
pixivpy3 = "3.7.5"
b2sdk = "2.12.0"
redis = "8.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.coverage.run]
omit = ["tests/*"]
patch = ["subprocess"]
sigterm = true
