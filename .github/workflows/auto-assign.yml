name: Auto Assign

on:
  pull_request_target:
    types: [opened, ready_for_review]

# This workflow does not check out or execute pull request code, so it can safely
# assign pull requests opened from forks and by dependency update bots.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    name: Assign reviewers and assignees
    runs-on: ubuntu-latest
    steps:
      - name: Assign pull request
        uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
