services:
  storage-permissions:
    image: ghcr.io/expliyh/py-acgimg-bot:main
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /app/storage && chown -R app:app /app/storage"]
    volumes:
      - ./storage:/app/storage

  app:
    image: ghcr.io/expliyh/py-acgimg-bot:main
    restart: unless-stopped
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    environment:
      DATABASE_TYPE: sqlite
      SQLITE_PATH: /app/storage/acgimg.db
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
